name: Publish to PyPI

# Publishes ai-captcha to PyPI using Trusted Publishing (OpenID Connect).
# No API token is stored here — the gh-action-pypi-publish step exchanges a
# short-lived OIDC token for a PyPI publishing credential. This requires a
# "Pending publisher" approval on PyPI for the owner r3sbarra (see README /
# project docs for the exact repository + workflow name to register).
#
# Triggers on a published GitHub Release, or manually via workflow_dispatch.

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build wheel and sdist
      run: |
        python -m build

    - name: Verify package
      run: |
        twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
