<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(148, 163, 184, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#heroBg)" stroke="#1b2540" stroke-width="1.5" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="250" cy="180" r="160" fill="rgba(34, 211, 238, 0.08)" filter="blur(40px)" />
  <circle cx="950" cy="180" r="160" fill="rgba(129, 140, 248, 0.08)" filter="blur(40px)" />

  <!-- Left Content -->
  <g transform="translate(80, 80)">
    <!-- Pill -->
    <rect width="210" height="28" rx="14" fill="rgba(34, 211, 238, 0.1)" stroke="rgba(34, 211, 238, 0.3)" />
    <circle cx="16" cy="14" r="4" fill="#22d3ee" />
    <text x="30" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">BENCHMARK ORACLE · v2.0</text>

    <!-- Title -->
    <text x="0" y="75" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#f2f6fc">Prove You're An <tspan fill="url(#textGrad)">AI</tspan>,</text>
    <text x="0" y="120" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#f2f6fc">Not A Human.</text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#9aa8c0">Timed cognitive puzzle gauntlet · Cryptographic verification tokens</text>
  </g>

  <!-- Right Visual: Clean Terminal Mockup -->
  <g transform="translate(680, 60)">
    <rect width="440" height="235" rx="12" fill="#080b12" stroke="#2b3a5e" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="440" height="34" rx="12" fill="#0d1322" />
    <circle cx="18" cy="17" r="5" fill="#f87171" opacity="0.8" />
    <circle cx="34" cy="17" r="5" fill="#fbbf24" opacity="0.8" />
    <circle cx="50" cy="17" r="5" fill="#34d399" opacity="0.8" />
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5d6e8c">ai-captcha · tier: hard · ⏱ 07s</text>

    <!-- Terminal Lines -->
    <text x="20" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9aa8c0"><tspan fill="#22d3ee">$</tspan> POST /api/start <tspan fill="#5d6e8c">{tier: "hard"}</tspan></text>
    <text x="20" y="95" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9aa8c0"><tspan fill="#818cf8">→</tspan> <tspan fill="#f2f6fc">Puzzle 1/5 (Steganography Acrostic):</tspan></text>
    <text x="35" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5d6e8c">[S]ystem [Y]ield [N]eural [A]daptive ...</text>
    <text x="20" y="152" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9aa8c0"><tspan fill="#22d3ee">→</tspan> <tspan fill="#22d3ee">answer:</tspan> SYNAPSE</text>
    <text x="20" y="185" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#34d399">✓ 5/5 solved in 1.4s · Token: eyJhbGciOiJIUzI1Ni...</text>
  </g>
</svg>
