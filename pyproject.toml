[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-captcha"
version = "1.0.0"
description = "Reverse-CAPTCHA challenge app — proves you're an AI, not a human. Timed puzzle series with complexity gating. Standalone, AppManager plugin, or embeddable in any Flask project."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Richard"},
]
keywords = ["captcha", "ai", "flask", "puzzle", "challenge", "llm", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "pyjwt>=2.8",
    "appmanager-sdk>=0.1.0",
]

[project.optional-dependencies]
webui = [
    "gunicorn>=21.2",
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-flask>=1.3",
]

[project.scripts]
ai-captcha = "ai_captcha.app:run_standalone"
ai-captcha-init = "ai_captcha.cli:init_db"

[project.urls]
Homepage = "https://github.com/r3sbarra/ai-captcha"
Repository = "https://github.com/r3sbarra/ai-captcha"
Issues = "https://github.com/r3sbarra/ai-captcha/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_captcha*"]

[tool.setuptools.package-data]
ai_captcha = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/img/*",
    "engine/puzzles/data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ai_captcha --cov-report=term-missing"

[project.entry-points."flask.commands"]
ai-captcha = "ai_captcha.cli:cli"
